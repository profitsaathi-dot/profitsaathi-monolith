# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=validate

# =========================================================
# REDIS
# =========================================================
spring.redis.url=rediss://default:DUDMh5J5OrN7C7TqWQb33FO1QDwnuvhm@volcano-ship-colorfast-57988.db.redis.io:14118
spring.redis.ssl.enabled=true

# =========================================================
# CORS
# =========================================================
allowed.origins=${ALLOWED_ORIGINS}

# =========================================================
# JWT SECURITY
# =========================================================
security.jwt.secret=${JWT_SECRET}

security.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:60}
security.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:14}

security.jwt.issuer=${JWT_ISSUER:profitsaathi}

# =========================================================
# AES ENCRYPTION
# =========================================================
aes.secret.key=${AES_SECRET_KEY}

# =========================================================
# SMTP / MAIL
# =========================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =========================================================
# WHATSAPP (WAHA)
# =========================================================
profitsaathi.whatsapp.url=${WAHA_URL}
profitsaathi.whatsapp.api-key=${WAHA_API_KEY}

# =========================================================
# RAZORPAY
# =========================================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# =========================================================
# AI CONFIGURATION
# =========================================================
ai.google.api-key=${GOOGLE_AI_API_KEY:}

ai.openrouter.api-key=${OPENROUTER_API_KEY:}
ai.openrouter.site-url=${OPENROUTER_SITE_URL:}
ai.openrouter.site-name=${OPENROUTER_SITE_NAME:ProfitSaathi}

# =========================================================
# PRICING ENGINE
# =========================================================
pricing.safe-margin=${PRICING_SAFE_MARGIN:30}
pricing.aggressive-margin=${PRICING_AGGRESSIVE_MARGIN:20}

# Daily 03:00 IST
# Set PRICING_SCHEDULER_CRON=- to disable
pricing.scheduler.cron=${PRICING_SCHEDULER_CRON:0 0 3 * * ?}
pricing.scheduler.delay-ms=${PRICING_SCHEDULER_DELAY_MS:1500}

# =========================================================
# REPORT SCHEDULERS
# =========================================================
report.monthly.enabled=${REPORT_MONTHLY_ENABLED:true}
report.monthly.cron=${REPORT_MONTHLY_CRON:0 0 2 1 * ?}

report.weekly.enabled=${REPORT_WEEKLY_ENABLED:true}
report.weekly.cron=${REPORT_WEEKLY_CRON:0 0 6 * * MON}

# =========================================================
# GEO API
# =========================================================
geocode.api.key=${GEO_API_KEY}
geocode.base.url=${GEO_BASE_URL}

# =========================================================
# OPEN WAHA API
# =========================================================
profitsaathi.whatsapp.OpenWA.api-key=${OPEN_WA_API_KEY}

# =========================================================
# PUBLIC API
# =========================================================
profitsaathi.public-api-url=${PUBLIC_API_URL}
