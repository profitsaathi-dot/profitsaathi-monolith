# =========================================================
# APPLICATION
# =========================================================
spring.application.name=profitsaathi-monolith
spring.profiles.active=uat
server.port=${PORT:9097}

spring.main.lazy-initialization=false

# =========================================================
# TIMEZONE
# =========================================================
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================================================
# SERVER / TOMCAT
# =========================================================
server.shutdown=graceful
server.forward-headers-strategy=framework

server.tomcat.threads.max=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.tomcat.max-swallow-size=100MB

spring.lifecycle.timeout-per-shutdown-phase=30s

# =========================================================
# RESPONSE COMPRESSION
# =========================================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript
server.compression.min-response-size=1024

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.resolve-lazily=true

product.image.upload-dir=uploads/products
file.upload-dir=uploads/payment

# =========================================================
# THREAD POOLS
# =========================================================
spring.task.scheduling.pool.size=5

# =========================================================
# LOGGING
# =========================================================
logging.level.root=INFO
logging.level.com.profitsaathi=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D

# =========================================================
# DATABASE / JPA
# =========================================================
spring.jpa.open-in-view=false

# Recommended:
# update -> only for dev/uat
# validate -> production safer option
#spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# HIKARI CONNECTION POOL
# =========================================================
spring.datasource.hikari.pool-name=ProfitSaathiPool

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

spring.datasource.hikari.leak-detection-threshold=60000

# =========================================================
# REDIS
# =========================================================
spring.data.redis.timeout=6000

# =========================================================
# ACTUATOR / MONITORING
# =========================================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

management.health.redis.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true

management.metrics.tags.application=${spring.application.name}

# =========================================================
# SWAGGER / SPRINGDOC
# =========================================================
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true

# =========================================================
# AI CONFIGURATION
# =========================================================
ai.growth-card-free-model=${AI_GROWTH_FREE_MODEL:openai/gpt-oss-120b:free}
ai.growth-card-premium-model=${AI_GROWTH_PREMIUM_MODEL:anthropic/claude-3.5-sonnet}

ai.growth-card-cooldown-hours-free=${AI_GROWTH_COOLDOWN_FREE:24}
ai.growth-card-cooldown-hours-premium=${AI_GROWTH_COOLDOWN_PREMIUM:6}

# =========================================================
# GROWTH CARD SCHEDULER
# =========================================================
growth-card.scheduler.cron=${GROWTH_CARD_CRON:0 0 4 * * *}
growth-card.scheduler.delay-ms=${GROWTH_CARD_DELAY_MS:1500}

growth-card.gc.cron=${GROWTH_CARD_GC_CRON:0 30 4 * * SUN}

# =========================================================
# SECURITY
# =========================================================
security.admin.signup-secret=${SECURITY_ADMIN_SIGNUP_SECRET:}
