spring.application.name=profitsaathi-monolith
spring.profiles.active=uat
server.port=${PORT:8080}
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.root=INFO
logging.level.com.profitsaathi=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


server.shutdown=graceful
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=30s

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,image/png,image/jpeg
server.compression.min-response-size=1024

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.resolve-lazily=true

spring.task.scheduling.pool.size=5

product.image.upload-dir=uploads/products
file.upload-dir=uploads/payment

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
# Required so /actuator/health includes the per-component breakdown (db, redis,
# diskSpace, ...). Default `never` returns just {"status":"UP"} which leaves
# the system-status dashboard with nothing to render.
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.metrics.tags.application=${spring.application.name}
management.health.redis.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true

# ── springdoc / Swagger UI ─────────────────────────────────────────────────
# nginx fronts the monolith under /spring/*. Swagger UI's bundled JS fetches
# /v3/api-docs and /v3/api-docs/swagger-config relative to its own origin,
# which would 404 because nginx doesn't route those bare paths. Pin both to
# the prefixed URL so "Failed to load remote configuration" goes away.
springdoc.swagger-ui.url=/spring/v3/api-docs
springdoc.swagger-ui.config-url=/spring/v3/api-docs/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=ProfitSaathiPool

spring.data.redis.timeout=6000


# Growth Adviser card-driven mode. Free sellers always get the free
# OpenRouter model and a 24h cooldown; sellers with an ACTIVE non-FREE
# subscription get the premium model and a tighter cooldown.
ai.growth-card-free-model=${AI_GROWTH_FREE_MODEL:openai/gpt-oss-120b:free}
ai.growth-card-premium-model=${AI_GROWTH_PREMIUM_MODEL:anthropic/claude-3.5-sonnet}
ai.growth-card-cooldown-hours-free=${AI_GROWTH_COOLDOWN_FREE:24}
ai.growth-card-cooldown-hours-premium=${AI_GROWTH_COOLDOWN_PREMIUM:6}

# Daily auto-sync cron (server tz). Set to "-" to disable. Default 04:00.
growth-card.scheduler.cron=${GROWTH_CARD_CRON:0 0 4 * * *}
growth-card.scheduler.delay-ms=${GROWTH_CARD_DELAY_MS:1500}
# Weekly GC of stale/dismissed cards older than 60 days. Sun 04:30.
growth-card.gc.cron=${GROWTH_CARD_GC_CRON:0 30 4 * * SUN}

