<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:Segoe UI, Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
    <tr>
        <td align="center">
            <table width="500" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;padding:40px;
                          box-shadow:0 10px 25px rgba(0,0,0,0.08);">

                <!-- Header -->
                <tr>
                    <td align="center" style="padding-bottom:25px;">
                        <h1 style="margin:0;font-size:22px;color:#111827;font-weight:600;">
                            Account Verification
                        </h1>
                        <div style="width:60px;height:4px;background:#2563eb;margin:12px auto 0;border-radius:4px;"></div>
                    </td>
                </tr>

                <!-- Greeting -->
                <tr>
                    <td style="font-size:16px;color:#374151;padding-bottom:15px;">
                        Dear <strong><span th:text="${name}"></span></strong>,
                    </td>
                </tr>

                <!-- Message -->
                <tr>
                    <td style="font-size:15px;color:#4b5563;padding-bottom:20px;">
                        Please use the following One-Time Password (OTP) to continue:
                    </td>
                </tr>

                <!-- OTP Box -->
                <tr>
                    <td align="center" style="padding:20px 0;">
                        <div style="
                            display:inline-block;
                            background:#eff6ff;
                            color:#2563eb;
                            font-size:28px;
                            font-weight:bold;
                            letter-spacing:8px;
                            padding:15px 30px;
                            border-radius:8px;
                            border:1px solid #dbeafe;">
                            <span th:text="${otp}"></span>
                        </div>
                    </td>
                </tr>

                <!-- Expiry -->
                <tr>
                    <td align="center" style="font-size:14px;color:#6b7280;padding-top:10px;">
                        This code is valid for
                        <strong><span th:text="${expiry}"></span></strong> minutes.
                    </td>
                </tr>

                <!-- Divider -->
                <tr>
                    <td style="padding:25px 0;">
                        <hr style="border:none;border-top:1px solid #e5e7eb;">
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="font-size:14px;color:#9ca3af;text-align:center;">
                        If you didn’t request this code, please ignore this email.
                        <br><br>
                        Regards,<br>
                        <strong>Your System</strong>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
